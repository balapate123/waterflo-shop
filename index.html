<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a237e">
  <title>Waterflo - Distributor Order Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="landing-page">

  <!-- HEADER -->
  <header class="header">
    <div class="logo-wrap">
      <div>
        <div class="logo-text">Water<span>flo</span>&reg;</div>
        <span class="logo-sub">Distributor Order Portal</span>
      </div>
    </div>
    <div class="header-actions">
      <span class="user-info" id="userInfo"></span>
      <button class="cart-btn" id="homeCartBtn" onclick="toggleHomeCart()" title="Cart">
        &#x1F6D2; <span class="cart-label">Cart</span>
        <span class="cart-badge" id="homeCartBadge" style="display:none">0</span>
      </button>
      <button class="cart-btn" id="myOrdersBtn" onclick="toggleMyOrders()" title="My Orders">&#x1F4CB; Orders</button>
      <a href="/admin.html" class="cart-btn" id="adminLink" style="display:none;text-decoration:none;color:white" title="Admin Dashboard">&#x2699; Admin</a>
      <button class="cart-btn" id="logoutBtn" onclick="handleLogout()" title="Logout">&#x23FB; Logout</button>
    </div>
  </header>

  <!-- HERO -->
  <div class="landing-hero" id="landingHero">
    <h1>Waterflo Pipes &amp; Fittings</h1>
    <p>Select a brand to browse products and place orders</p>
    <!-- Product Lookup Search -->
    <div class="home-search-wrap" id="homeSearchWrap">
      <span class="home-search-icon">&#x1F50D;</span>
      <input type="search" class="home-search-input" id="homeSearchInput" placeholder="Search products across all brands..." autocomplete="off"
        oninput="homeProductSearch()" onkeydown="homeSearchKeydown(event)">
      <button class="home-search-clear" id="homeSearchClear" onclick="clearHomeSearch()">&times;</button>
      <div class="home-lookup-results" id="homeLookupResults"></div>
    </div>
    <!-- Selected product detail -->
    <div class="home-product-detail" id="homeProductDetail"></div>
  </div>

  <!-- BRAND GRID -->
  <main class="brand-grid" id="brandGrid">
    <!-- Rendered by JS -->
  </main>

  <!-- MY ORDERS PANEL -->
  <div id="myOrdersPanel" style="display:none">
    <div class="my-orders-container">
      <div class="my-orders-header">
        <h2>My Orders</h2>
        <button onclick="toggleMyOrders()" class="my-orders-close">&times;</button>
      </div>
      <div id="myOrdersList" class="my-orders-list">
        <p style="text-align:center;padding:32px;color:#888">Loading orders...</p>
      </div>
    </div>
  </div>

  <!-- ORDER DETAIL MODAL -->
  <div id="orderDetailModal" class="order-detail-overlay" style="display:none" onclick="if(event.target===this)closeOrderDetail()">
    <div class="order-detail-modal">
      <div class="order-detail-header">
        <h3 id="orderDetailTitle">Order Details</h3>
        <button onclick="closeOrderDetail()" class="my-orders-close">&times;</button>
      </div>
      <div id="orderDetailBody"></div>
    </div>
  </div>

  <!-- CART OVERLAY -->
  <div class="cart-overlay" id="homeCartOverlay" onclick="toggleHomeCart()"></div>

  <!-- CART PANEL -->
  <aside class="cart-panel" id="homeCartPanel">
    <div class="cart-header">
      <div>
        <h2>Your Cart</h2>
        <div class="cart-header-sub"><span id="homeCartItemCount">0 items</span></div>
      </div>
      <div class="cart-header-actions">
        <button class="btn-icon" id="homeClearCartBtn" onclick="clearHomeCart()" title="Clear cart">&#x1F5D1; Clear</button>
        <button id="homeCloseCart" onclick="toggleHomeCart()" style="background:none;border:none;color:white;font-size:1.3rem;cursor:pointer">&times;</button>
      </div>
    </div>
    <div class="cart-items" id="homeCartItems">
      <div class="cart-empty">
        <div class="cart-empty-icon">&#x1F6D2;</div>
        <p>Your cart is empty</p>
        <p class="cart-empty-sub">Search for products above to add items</p>
      </div>
    </div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span class="cart-total-label">Total</span>
        <span id="homeCartTotal">&#x20B9;0.00</span>
      </div>
      <div class="cart-footer-btns">
        <button class="btn-quote" onclick="goToCartBrand()">&#x1F6D2; Continue Shopping</button>
      </div>
    </div>
  </aside>

  <!-- FOOTER -->
  <footer class="landing-footer">
    <p>www.waterflo.in</p>
  </footer>

  <script src="js/brand-config.js"></script>
  <script>
    // Load user info and filter brands by access
    async function initLanding() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) { window.location.href = '/login.html'; return; }
        const data = await res.json();
        const user = data.user;
        document.getElementById('userInfo').textContent = user.company_name || user.contact_name;
        if (user.role === 'admin') document.getElementById('adminLink').style.display = '';
        if (user.role === 'salesman' && data.linked_dealers) {
          setTimeout(function() { renderDealerLanding(data.linked_dealers); }, 0);
        }

        // Fetch brands user has access to
        const bRes = await fetch('/api/brands');
        if (bRes.ok) {
          const { brands } = await bRes.json();
          renderBrandGrid(brands);
        } else {
          renderBrandGrid(BRANDS);
        }
      } catch (e) {
        // Fallback: render all brands (works when opened without server)
        renderBrandGrid(BRANDS);
      }
    }

    function renderBrandGrid(brands) {
      const grid = document.getElementById('brandGrid');
      // Match brand metadata from BRANDS config
      grid.innerHTML = brands.map(b => {
        const cfg = getBrandById(b.id) || b;
        return `
        <a href="brand.html?brand=${b.id}" class="brand-card" style="--brand-color: ${cfg.color || b.color}">
          <div class="brand-card-icon" style="background: ${cfg.heroGradient || ''}">${cfg.icon || b.short_name || ''}</div>
          <div class="brand-card-body">
            <div class="brand-card-name">${cfg.name || b.name}</div>
            <div class="brand-card-tagline">${cfg.tagline || b.tagline || ''}</div>
            <div class="brand-card-date">w.e.f. ${cfg.priceDate || b.price_date || ''}</div>
          </div>
          <div class="brand-card-arrow">&rarr;</div>
        </a>`;
      }).join('');
    }

    function renderDealerLanding(dealers) {
      var lh = document.getElementById('landingHero');
      var currentDealer = localStorage.getItem('wf_salesman_dealer');
      var html = '<div style="margin:16px auto;max-width:400px;background:rgba(255,255,255,0.1);padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,0.2)">';
      html += '<p style="margin-bottom:8px;font-weight:600">👤 Placing order on behalf of:</p>';
      html += '<select id="landingDealerSelect" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;color:#333;font-size:1rem" onchange="localStorage.setItem(\'wf_salesman_dealer\', this.value);">';
      if (!currentDealer) html += '<option value="">-- Select Dealer --</option>';
      dealers.forEach(function(d) {
        html += '<option value="' + d.id + '"' + (currentDealer == d.id ? ' selected' : '') + '>' + d.company_name + '</option>';
      });
      html += '</select></div>';
      lh.insertAdjacentHTML('beforeend', html);
    }

    async function handleLogout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    var myOrdersOpen = false;

    async function toggleMyOrders() {
      var panel = document.getElementById('myOrdersPanel');
      myOrdersOpen = !myOrdersOpen;
      panel.style.display = myOrdersOpen ? '' : 'none';
      if (myOrdersOpen) loadMyOrders();
    }

    async function loadMyOrders() {
      var list = document.getElementById('myOrdersList');
      list.innerHTML = '<p style="text-align:center;padding:32px;color:#888">Loading orders...</p>';
      try {
        var res = await fetch('/api/orders');
        if (!res.ok) throw new Error('Failed to load');
        var data = await res.json();
        var orders = data.orders || [];
        if (!orders.length) {
          list.innerHTML = '<p style="text-align:center;padding:32px;color:#888">No orders placed yet.</p>';
          return;
        }
        list.innerHTML = orders.map(function(o) {
          var date = new Date(o.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
          var statusClass = 'status-' + (o.status || 'pending');
          var net = o.net_amount != null ? o.net_amount : o.total_amount;
          return '<div class="my-order-card" onclick="viewOrderDetail(' + o.id + ')">' +
            '<div class="my-order-top">' +
              '<span class="my-order-no">' + escHtml(o.order_no) + '</span>' +
              '<span class="my-order-status ' + statusClass + '">' + escHtml(o.status || 'pending') + '</span>' +
            '</div>' +
            '<div class="my-order-info">' +
              '<span>' + escHtml(o.brand_name || o.brand_short_name || o.brand_id) + '</span>' +
              '<span>' + date + '</span>' +
            '</div>' +
            '<div class="my-order-bottom">' +
              (o.discount_percent > 0 ? '<span class="my-order-discount">Disc: ' + o.discount_percent + '%</span>' : '<span></span>') +
              '<span class="my-order-amount">&#x20B9; ' + Number(net).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</span>' +
            '</div>' +
          '</div>';
        }).join('');
      } catch (e) {
        list.innerHTML = '<p style="text-align:center;padding:32px;color:#c62828">Error loading orders. Please try again.</p>';
      }
    }

    async function viewOrderDetail(orderId) {
      var modal = document.getElementById('orderDetailModal');
      var body = document.getElementById('orderDetailBody');
      modal.style.display = '';
      body.innerHTML = '<p style="text-align:center;padding:24px;color:#888">Loading...</p>';
      try {
        var res = await fetch('/api/orders/' + orderId);
        if (!res.ok) throw new Error('Failed');
        var data = await res.json();
        var o = data.order;
        var items = data.items || [];
        document.getElementById('orderDetailTitle').textContent = o.order_no;
        var date = new Date(o.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        var net = o.net_amount != null ? o.net_amount : o.total_amount;
        var html = '<div class="od-summary">' +
          '<div class="od-row"><span>Brand</span><span>' + escHtml(o.brand_name || o.brand_id) + '</span></div>' +
          '<div class="od-row"><span>Date</span><span>' + date + '</span></div>' +
          '<div class="od-row"><span>Status</span><span class="my-order-status status-' + (o.status||'pending') + '">' + escHtml(o.status||'pending') + '</span></div>' +
          '<div class="od-row"><span>Total</span><span>&#x20B9; ' + Number(o.total_amount).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</span></div>' +
          (o.discount_percent > 0 ? '<div class="od-row"><span>Discount</span><span>' + o.discount_percent + '%</span></div>' : '') +
          '<div class="od-row od-net"><span>Net Amount</span><span>&#x20B9; ' + Number(net).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</span></div>' +
          (o.notes ? '<div class="od-row"><span>Notes</span><span>' + escHtml(o.notes) + '</span></div>' : '') +
        '</div>';
        html += '<table class="od-table"><thead><tr><th>Product</th><th>Size</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>';
        items.forEach(function(it) {
          var amt = (it.rate_per_unit || 0) * (it.qty || 0);
          html += '<tr><td>' + escHtml(it.name) + '<br><small style="color:#888">' + escHtml(it.code) + '</small></td>' +
            '<td>' + escHtml(it.size) + '</td>' +
            '<td>' + it.qty + ' ' + escHtml(it.unit_label || it.unit_type || '') + '</td>' +
            '<td>&#x20B9;' + Number(it.rate_per_unit).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</td>' +
            '<td>&#x20B9;' + Number(amt).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</td></tr>';
        });
        html += '</tbody></table>';
        body.innerHTML = html;
      } catch (e) {
        body.innerHTML = '<p style="text-align:center;padding:24px;color:#c62828">Error loading order details.</p>';
      }
    }

    function closeOrderDetail() {
      document.getElementById('orderDetailModal').style.display = 'none';
    }

    function escHtml(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ═══ PRODUCT LOOKUP ═══
    var homeLookupCache = {};
    var homeLookupResults = [];
    var homeLookupHighlight = -1;
    var homeLookupTimer = null;
    var homeSelectedProduct = null;

    function homeProductSearch() {
      var input = document.getElementById('homeSearchInput');
      var q = input.value.trim();
      var clearBtn = document.getElementById('homeSearchClear');
      clearBtn.style.display = q.length > 0 ? 'block' : 'none';

      homeSelectedProduct = null;
      document.getElementById('homeProductDetail').style.display = 'none';

      if (q.length < 2) {
        document.getElementById('homeLookupResults').style.display = 'none';
        homeLookupResults = [];
        return;
      }

      clearTimeout(homeLookupTimer);
      homeLookupTimer = setTimeout(function() {
        var cacheKey = q.toLowerCase();
        if (homeLookupCache[cacheKey]) {
          renderHomeLookupResults(homeLookupCache[cacheKey]);
          return;
        }
        fetch('/api/brands/search-products?q=' + encodeURIComponent(q))
          .then(function(r) { return r.json(); })
          .then(function(data) {
            homeLookupCache[cacheKey] = data.products || [];
            renderHomeLookupResults(data.products || []);
          });
      }, 250);
    }

    function renderHomeLookupResults(products) {
      var container = document.getElementById('homeLookupResults');
      homeLookupResults = products;
      homeLookupHighlight = -1;

      if (products.length === 0) {
        container.innerHTML = '<div style="padding:14px;color:#999;font-size:0.85rem;text-align:center">No products found</div>';
        container.style.display = 'block';
        return;
      }

      container.innerHTML = products.slice(0, 50).map(function(p, i) {
        return '<div class="home-lookup-item" data-index="' + i + '" onclick="selectHomeProduct(' + i + ')" onmouseenter="homeLookupHighlight=' + i + ';highlightHomeLookupItem()">'
          + '<div class="hl-top">'
          + '<div><span class="hl-code">' + escHtml(p.code) + '</span><span class="hl-name">' + escHtml(p.name) + '</span></div>'
          + '<span class="hl-brand">' + escHtml(p.brand_name || p.brand_short_name || '') + '</span>'
          + '</div>'
          + '<div class="hl-details">Size: ' + escHtml(p.size) + ' &middot; Rate: &#x20B9;' + Number(p.rate).toFixed(2) + (p.std_pkg ? ' &middot; Pkg: ' + p.std_pkg : '') + '</div>'
          + '</div>';
      }).join('');
      container.style.display = 'block';
    }

    function highlightHomeLookupItem() {
      var items = document.querySelectorAll('.home-lookup-item');
      items.forEach(function(el, i) {
        el.classList.toggle('highlighted', i === homeLookupHighlight);
      });
    }

    function homeSearchKeydown(e) {
      if (!homeLookupResults.length) return;
      var maxIdx = Math.min(homeLookupResults.length, 50) - 1;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        homeLookupHighlight = Math.min(homeLookupHighlight + 1, maxIdx);
        highlightHomeLookupItem();
        var items = document.querySelectorAll('.home-lookup-item');
        if (items[homeLookupHighlight]) items[homeLookupHighlight].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        homeLookupHighlight = Math.max(homeLookupHighlight - 1, 0);
        highlightHomeLookupItem();
        var items = document.querySelectorAll('.home-lookup-item');
        if (items[homeLookupHighlight]) items[homeLookupHighlight].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter' && homeLookupHighlight >= 0) {
        e.preventDefault();
        selectHomeProduct(homeLookupHighlight);
      } else if (e.key === 'Escape') {
        document.getElementById('homeLookupResults').style.display = 'none';
      }
    }

    function selectHomeProduct(index) {
      var p = homeLookupResults[index];
      if (!p) return;
      homeSelectedProduct = p;
      document.getElementById('homeLookupResults').style.display = 'none';
      document.getElementById('homeSearchInput').value = p.code + ' - ' + p.name;

      // Show product detail card
      var detail = document.getElementById('homeProductDetail');
      var brandCfg = getBrandById(p.brand_id);
      var brandName = brandCfg ? brandCfg.name : (p.brand_name || p.brand_id);
      var unitLabel = '';
      var pcsPerUnit = 1;
      var ratePerUnit = p.rate;

      // Determine unit options
      if (p.category === 'pipes') {
        if (p.rate_3mtr && p.qty_bundle) {
          pcsPerUnit = p.qty_bundle;
          ratePerUnit = p.rate_3mtr * p.qty_bundle;
          unitLabel = 'Bundle &middot; ' + p.qty_bundle + ' (3m)';
        } else {
          unitLabel = '1 Pipe';
        }
      } else if (p.std_pkg && parseInt(p.std_pkg) > 1) {
        pcsPerUnit = parseInt(p.std_pkg);
        ratePerUnit = p.rate * pcsPerUnit;
        unitLabel = 'Pkg &middot; ' + pcsPerUnit;
      } else if (p.qty_box && parseInt(p.qty_box) > 1) {
        pcsPerUnit = parseInt(p.qty_box);
        ratePerUnit = p.rate * pcsPerUnit;
        unitLabel = 'Box &middot; ' + pcsPerUnit;
      } else {
        unitLabel = '1 Pc';
      }

      detail.innerHTML =
        '<div class="hpd-header">'
        + '<div><div class="hpd-title">' + escHtml(p.name) + '</div><div class="hpd-code">' + escHtml(p.code) + '</div></div>'
        + '<button class="hpd-close" onclick="clearHomeSearch()">&times;</button>'
        + '</div>'
        + '<div class="hpd-meta">'
        + '<span>Brand: <strong>' + escHtml(brandName) + '</strong></span>'
        + '<span>Size: <strong>' + escHtml(p.size) + '</strong></span>'
        + '<span>Rate: <strong>&#x20B9;' + Number(p.rate).toFixed(2) + '/pc</strong></span>'
        + (unitLabel !== '1 Pc' ? '<span>Unit: <strong>' + unitLabel + ' = &#x20B9;' + Number(ratePerUnit).toFixed(2) + '</strong></span>' : '')
        + '</div>'
        + '<div class="hpd-actions">'
        + '<div class="hpd-qty-wrap">'
        + '<button class="hpd-qty-btn" onclick="homeDetailQty(-1)">-</button>'
        + '<input type="number" class="hpd-qty-input" id="homeDetailQtyInput" value="1" min="1">'
        + '<button class="hpd-qty-btn" onclick="homeDetailQty(1)">+</button>'
        + '</div>'
        + '<button class="hpd-add-btn" id="homeAddBtn" onclick="addHomeProductToCart()"'
        + ' data-brand="' + escHtml(p.brand_id) + '"'
        + ' data-code="' + escHtml(p.code) + '"'
        + ' data-name="' + escHtml(p.name) + '"'
        + ' data-size="' + escHtml(p.size) + '"'
        + ' data-category="' + escHtml(p.category || '') + '"'
        + ' data-unit-type="' + (p.std_pkg > 1 ? 'stdpkg' : (p.qty_box > 1 ? 'box' : 'piece')) + '"'
        + ' data-unit-label="' + unitLabel + '"'
        + ' data-pcs="' + pcsPerUnit + '"'
        + ' data-rate="' + ratePerUnit.toFixed(2) + '"'
        + '>+ Add to Cart</button>'
        + '<a href="brand.html?brand=' + encodeURIComponent(p.brand_id) + '" class="hpd-view-link">View in ' + escHtml(brandCfg ? brandCfg.shortName : brandName) + ' &rarr;</a>'
        + '</div>';
      detail.style.display = 'block';
    }

    function homeDetailQty(delta) {
      var input = document.getElementById('homeDetailQtyInput');
      var val = parseInt(input.value) || 1;
      val = Math.max(1, val + delta);
      input.value = val;
    }

    function addHomeProductToCart() {
      var btn = document.getElementById('homeAddBtn');
      var qty = parseInt(document.getElementById('homeDetailQtyInput').value) || 1;

      var brandId = btn.dataset.brand;
      var code = btn.dataset.code;
      var unitType = btn.dataset.unitType;
      var cartKey = brandId + '_' + code + '_' + unitType;

      // Read existing cart
      var homeCart = JSON.parse(localStorage.getItem('wf_cart') || '[]');
      var existing = homeCart.find(function(x) { return x.cartKey === cartKey; });

      if (existing) {
        existing.qty += qty;
      } else {
        homeCart.push({
          cartKey: cartKey,
          brandId: brandId,
          code: code,
          name: btn.dataset.name,
          size: btn.dataset.size,
          category: btn.dataset.category,
          unitType: unitType,
          unitLabel: btn.dataset.unitLabel,
          pcsPerUnit: parseInt(btn.dataset.pcs),
          ratePerUnit: parseFloat(btn.dataset.rate),
          qty: qty
        });
      }

      localStorage.setItem('wf_cart', JSON.stringify(homeCart));
      updateHomeCartUI();

      // Feedback
      btn.textContent = '\u2713 Added!';
      btn.classList.add('added');
      setTimeout(function() { btn.textContent = '+ Add to Cart'; btn.classList.remove('added'); }, 1400);
    }

    function clearHomeSearch() {
      document.getElementById('homeSearchInput').value = '';
      document.getElementById('homeSearchClear').style.display = 'none';
      document.getElementById('homeLookupResults').style.display = 'none';
      document.getElementById('homeProductDetail').style.display = 'none';
      homeSelectedProduct = null;
      homeLookupResults = [];
    }

    // Close lookup when clicking outside
    document.addEventListener('click', function(e) {
      var wrap = document.getElementById('homeSearchWrap');
      if (wrap && !wrap.contains(e.target)) {
        document.getElementById('homeLookupResults').style.display = 'none';
      }
    });

    // ═══ HOMEPAGE CART ═══
    var homeCartOpen = false;

    function toggleHomeCart() {
      homeCartOpen = !homeCartOpen;
      document.getElementById('homeCartPanel').classList.toggle('open', homeCartOpen);
      document.getElementById('homeCartOverlay').classList.toggle('show', homeCartOpen);
      if (homeCartOpen) renderHomeCartItems();
    }

    function updateHomeCartUI() {
      var homeCart = JSON.parse(localStorage.getItem('wf_cart') || '[]');
      var count = homeCart.length;
      var badge = document.getElementById('homeCartBadge');
      badge.textContent = count;
      badge.style.display = count > 0 ? 'flex' : 'none';

      var total = homeCart.reduce(function(s, i) { return s + (i.ratePerUnit * i.qty); }, 0);
      var totalEl = document.getElementById('homeCartTotal');
      if (totalEl) totalEl.textContent = '\u20B9' + Number(total).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      var countEl = document.getElementById('homeCartItemCount');
      if (countEl) countEl.textContent = count + ' item' + (count !== 1 ? 's' : '');
    }

    function renderHomeCartItems() {
      var container = document.getElementById('homeCartItems');
      var homeCart = JSON.parse(localStorage.getItem('wf_cart') || '[]');

      if (homeCart.length === 0) {
        container.innerHTML =
          '<div class="cart-empty">'
          + '<div class="cart-empty-icon">&#x1F6D2;</div>'
          + '<p>Your cart is empty</p>'
          + '<p class="cart-empty-sub">Search for products above to add items</p>'
          + '</div>';
        return;
      }

      // Group by brand
      var groups = {};
      homeCart.forEach(function(item) {
        var bid = item.brandId || 'unknown';
        if (!groups[bid]) groups[bid] = [];
        groups[bid].push(item);
      });

      var html = '';
      Object.keys(groups).forEach(function(bid) {
        var brand = getBrandById(bid);
        var brandName = brand ? brand.shortName : bid;
        html += '<div class="ci-brand-group">'
          + '<span>' + escHtml(brandName) + '</span>'
          + '<a href="brand.html?brand=' + encodeURIComponent(bid) + '" class="ci-brand-link">Shop ' + escHtml(brandName) + ' &rarr;</a>'
          + '</div>';

        groups[bid].forEach(function(item) {
          var lineTotal = item.ratePerUnit * item.qty;
          html += '<div class="cart-item">'
            + '<div class="ci-row">'
            + '<div class="ci-info">'
            + '<div class="ci-name">' + escHtml(item.name) + '</div>'
            + '<div class="ci-meta">' + escHtml(item.code) + ' &middot; ' + escHtml(item.size) + ' &middot; ' + escHtml(item.unitLabel) + '</div>'
            + '</div>'
            + '<div class="ci-price">&#x20B9;' + Number(lineTotal).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</div>'
            + '</div>'
            + '<div class="ci-qty-row">'
            + '<button class="ci-qty-btn" onclick="homeCartQty(\'' + item.cartKey + '\', -1)">-</button>'
            + '<span class="ci-qty-val">' + item.qty + '</span>'
            + '<button class="ci-qty-btn" onclick="homeCartQty(\'' + item.cartKey + '\', 1)">+</button>'
            + '<button class="ci-remove" onclick="homeCartRemove(\'' + item.cartKey + '\')">Remove</button>'
            + '</div>'
            + '</div>';
        });
      });

      container.innerHTML = html;
    }

    function homeCartQty(cartKey, delta) {
      var homeCart = JSON.parse(localStorage.getItem('wf_cart') || '[]');
      var item = homeCart.find(function(x) { return x.cartKey === cartKey; });
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) homeCart = homeCart.filter(function(x) { return x.cartKey !== cartKey; });
      localStorage.setItem('wf_cart', JSON.stringify(homeCart));
      updateHomeCartUI();
      renderHomeCartItems();
    }

    function homeCartRemove(cartKey) {
      var homeCart = JSON.parse(localStorage.getItem('wf_cart') || '[]');
      homeCart = homeCart.filter(function(x) { return x.cartKey !== cartKey; });
      localStorage.setItem('wf_cart', JSON.stringify(homeCart));
      updateHomeCartUI();
      renderHomeCartItems();
    }

    function clearHomeCart() {
      if (!confirm('Clear all items from cart?')) return;
      localStorage.removeItem('wf_cart');
      updateHomeCartUI();
      renderHomeCartItems();
    }

    function goToCartBrand() {
      var homeCart = JSON.parse(localStorage.getItem('wf_cart') || '[]');
      if (homeCart.length > 0) {
        window.location.href = 'brand.html?brand=' + encodeURIComponent(homeCart[0].brandId);
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      initLanding();
      updateHomeCartUI();
    });
  </script>
</body>
</html>
